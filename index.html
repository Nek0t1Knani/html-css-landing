<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Landing Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="logo">BrandLogo</div>
        <nav class="nav">
            <a href="#">Головна</a>
            <a href="#">Про нас</a>
            <a href="#">Послуги</a>
            <a href="#">Контакти</a>
        </nav>
        <button class="btn btn-header">Зв'язатися</button>
    </header>

    <main class="hero">
        <div class="hero-content">
            <h1>Сучасні рішення для вашого бізнесу</h1>
            <p>Ми допомагаємо створювати якісні веб-сайти та цифрові продукти, які приваблюють клієнтів і приносять результат.</p>
            <div class="hero-buttons">
                <button class="btn btn-primary">Розпочати</button>
                <button class="btn btn-secondary">Дізнатися більше</button>
            </div>
        </div>
        <div class="hero-image">
            <div class="image-placeholder">
                <span>Preview Image</span>
            </div>
        </div>
    </main>

</body>
</html>
